<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - PageNest</title>
  <style>
    body{font-family:Arial;background:#edf3f8;padding:30px}
    .login-box{max-width:420px;margin:auto;background:white;border:1px solid #cbd5e1}
    h2{background:#17324d;color:#f2c96d;text-align:center;padding:16px;margin:0}
    form{padding:22px}
    label{display:block;margin:12px 0 5px}
    input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #9fb3c8}
    button{padding:8px 16px;margin-top:15px;border:0}
    .submit{background:#177e89;color:white}.reset{background:#e5eaf0}
  </style>
</head>
<body>
  <div class="login-box">
    <h2>BOOK HEAVEN</h2>
    <form>
      <h3>Login Page</h3>
      <label for="username">User Name:</label>
      <input id="username" name="username" type="text" required>
      <label for="password">Password:</label>
      <input id="password" name="password" type="password" required>
      <button class="submit" type="submit">Submit</button>
      <button class="reset" type="reset">Reset</button>
    </form>
  </div>
</body>
</html>
