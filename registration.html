<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    body{font-family:Arial;background:#edf3f8;padding:20px;color:#243746}
    form{max-width:640px;margin:auto;background:white;padding:22px;border:1px solid #cbd5e1}
    h2{text-align:center;color:#17324d}
    label{display:block;margin:10px 0 5px}
    input,select,textarea{padding:8px;border:1px solid #9fb3c8}
    input[type=text],input[type=email],input[type=password],input[type=tel],select,textarea{width:100%;box-sizing:border-box}
    .inline label{display:inline-block;margin-right:12px}
    button{padding:9px 15px;margin-top:14px;border:0}
    .create{background:#177e89;color:white}.reset{background:#e5eaf0}
  </style>
</head>
<body>
<form>
  <h2>Create Your Account</h2>
  <label for="name">Name *</label>
  <input id="name" name="name" type="text" required>
  <label for="password">Password *</label>
  <input id="password" name="password" type="password" required>
  <label for="email">Email ID *</label>
  <input id="email" name="email" type="email" required>
  <label for="phone">Phone Number *</label>
  <input id="phone" name="phone" type="tel" required>
  <label>Sex</label>
  <div class="inline">
    <label><input type="radio" name="sex" value="male"> Male</label>
    <label><input type="radio" name="sex" value="female"> Female</label>
    <label><input type="radio" name="sex" value="other"> Other</label>
  </div>
  <label for="dob">Date of Birth</label>
  <input id="dob" name="dob" type="date">
  <label for="language">Languages Known</label>
  <select id="language" name="language">
    <option>English</option>
    <option>Hindi</option>
    <option>Telugu</option>
    <option>Tamil</option>
</select>
  <label for="address">Address</label>
  <textarea id="address" name="address" rows="3"></textarea>
  <button class="create" type="submit">Create Account</button>
  <button class="reset" type="reset">Reset</button>
  <p>
    <small>* All required fields must be completed.</small>
</p>
</form>
</body>
</html>
