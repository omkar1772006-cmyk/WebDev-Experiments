<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <style>
    body{font-family:Arial;background:#edf3f8;padding:25px;color:#243746}
    main{max-width:700px;margin:auto;background:white;padding:22px}
    h2{color:#17324d}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #cbd5e1;padding:11px;text-align:left}
    th{background:#17324d;color:white}
    .total{font-weight:bold;color:#0b6573}
  </style>
</head>
<body>
<main>
  <h2>Shopping Cart</h2>
  <table>
    <tr>
        <th>Book Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Amount</th>
    </tr>
    <tr>
        <td>Introduction to Algorithms</td>
        <td>₹650</td>
        <td>1</td>
        <td>₹650</td>
    </tr>
    <tr>
        <td>Basic Electrical Engineering</td>
        <td>₹390</td>
        <td>1</td>
        <td>₹390</td>
    </tr>
    <tr>
        <td colspan="3" class="total">Total Amount</td>
        <td class="total">₹1,040</td>
    </tr>
  </table>
  <p>
    <a href="catalogue.html">Return to Catalogue</a>
</p>
</main>
</body>
</html>
